<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
url("photo1.jpeg");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding-left:60px;
}

.hero-content h1{
font-size:80px;
color:#E50914;
margin-bottom:10px;
}

.hero-content h2{
font-size:50px;
margin-bottom:15px;
}

.hero-content p{
font-size:22px;
margin-bottom:20px;
}

.play-btn{
background:#E50914;
color:white;
border:none;
padding:15px 30px;
font-size:22px;
border-radius:6px;
cursor:pointer;
}

.section{
padding:50px;
}

.section h2{
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:40px;
}

.card{
background:#222;
padding:20px;
width:220px;
border-radius:10px;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.gallery{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.gallery img{
width:300px;
border-radius:12px;
transition:.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

.finale{
text-align:center;
padding:100px 20px;
}

.finale h1{
font-size:60px;
color:#E50914;
margin-bottom:20px;
}

.finale p{
font-size:24px;

.finale h2{
margin-top:30px;
